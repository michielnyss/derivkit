[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "derivkit"
version = "0.1.0"
description = "Derivative pricing and calibration toolkit"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
examples = ["seaborn>=0.12.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["derivkit*"]
